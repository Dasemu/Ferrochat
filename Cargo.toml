[package]
name = "ferrochat"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Unofficial lightweight native WhatsApp desktop client written in Rust"
license = "MIT"
repository = "https://github.com/Dasemu/Ferrochat"
readme = "README.md"
publish = false
default-run = "ferrochat"

[dependencies]
# UI
iced = { version = "0.14", features = ["tokio", "image", "advanced", "svg", "canvas"] }
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
futures = "0.3"
# WhatsApp multi-device protocol (pure Rust). Default features off so the
# bundled plain SQLite is NOT linked: we link SQLCipher instead (see below).
whatsapp-rust = { version = "0.7", default-features = false, features = ["tokio-runtime", "tokio-native", "tokio-transport", "ureq-client"] }
whatsapp-rust-sqlite-storage = { version = "0.7", default-features = false }
libsqlite3-sys = { version = "0.37", features = ["bundled-sqlcipher"] }
diesel = { version = "2.3", default-features = false, features = ["sqlite"] }
# Local cache
rusqlite = "0.39"
# Secrets
keyring = "4.2"
secrecy = "0.10"
zeroize = "1"
getrandom = "0.3"
hex = "0.4"
# Logging / errors / config
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Feature crates
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
notify-rust = "4"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
rodio = { version = "0.21", default-features = false, features = ["playback"] }
ogg = "0.9"
opus = "0.3"
lru = "0.16"

[dev-dependencies]
waproto = { version = "0.7", features = ["serde-deserialize"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "symbols"
panic = "unwind"

