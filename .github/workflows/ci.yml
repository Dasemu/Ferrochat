name: CI

on:
  push:
    branches: [main, development, "feat/**"]
  pull_request:
    branches: [main, development]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake libdbus-1-dev libasound2-dev \
            libxkbcommon-dev libwayland-dev libssl-dev libfontconfig1-dev dbus gnome-keyring
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -- -D warnings
        run: cargo clippy --all-targets -- -D warnings
      # A private session bus: the tray test registers on a fake StatusNotifierWatcher.
      - name: cargo test
        run: dbus-run-session -- cargo test

      # Real Secret Service: guards the zbus executor feature (tokio vs async-io)
      # that keyring's blocking connection depends on.
      - name: cargo test real_keyring (gnome-keyring on a private bus)
        env:
          FERRO_REAL_KEYRING: "1"
        run: |
          dbus-run-session -- sh -c 'echo | gnome-keyring-daemon --unlock --components=secrets >/dev/null && cargo test --test real_keyring -- --ignored'
